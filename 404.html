<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found · Michael Gonzalez</title>
    <meta name="theme-color" content="#05070b">
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px 16px;
            background: radial-gradient(ellipse at 50% 40%, #0d1420 0%, #05070b 70%);
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow: hidden;
        }
        canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
        main { position: relative; z-index: 1; max-width: 520px; }
        .code { margin: 0; font-size: clamp(72px, 16vw, 140px); font-weight: 300; line-height: 1; letter-spacing: 4px;
                background: linear-gradient(100deg, #ffffff 20%, #99ccff 60%, #b388ff 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
        h1 { margin: 14px 0 10px; font-size: 22px; font-weight: 400; }
        p { margin: 0 0 26px; font-size: 15px; line-height: 1.6; color: rgba(255, 255, 255, 0.72); }
        a { display: inline-block; padding: 12px 22px; border-radius: 6px; background: #99ccff; color: #04121f; font-weight: bold; text-decoration: none; }
        a:hover { background: #bcdcff; }
        a:focus-visible { outline: 2px solid #99ccff; outline-offset: 3px; }
    </style>
</head>
<body>
    <canvas id="net" aria-hidden="true"></canvas>
    <main>
        <p class="code">404</p>
        <h1>This connection never formed</h1>
        <p>The page you were looking for isn't here. It may have moved, or the link has a typo.</p>
        <a href="/">Back to the brain</a>
    </main>
    <script>
        // A few drifting neurons with one missing connection
        (function () {
            const c = document.getElementById('net'), g = c.getContext('2d');
            const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            let W, H, pts = [];
            function size() {
                const d = Math.min(devicePixelRatio || 1, 2);
                W = innerWidth; H = innerHeight; c.width = W * d; c.height = H * d; g.setTransform(d, 0, 0, d, 0, 0);
                pts = Array.from({ length: Math.round(W * H / 22000) + 12 }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - 0.5) * 0.25, vy: (Math.random() - 0.5) * 0.25 }));
            }
            function frame() {
                g.clearRect(0, 0, W, H);
                pts.forEach((a, i) => {
                    if (!still) { a.x = (a.x + a.vx + W) % W; a.y = (a.y + a.vy + H) % H; }
                    for (let j = i + 1; j < pts.length; j++) {
                        const b = pts[j], d = Math.hypot(a.x - b.x, a.y - b.y);
                        if (d < 140) { g.strokeStyle = 'rgba(153,204,255,' + (0.16 * (1 - d / 140)) + ')'; g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke(); }
                    }
                    g.fillStyle = i % 3 ? 'rgba(153,204,255,0.7)' : 'rgba(179,136,255,0.7)';
                    g.beginPath(); g.arc(a.x, a.y, 2, 0, Math.PI * 2); g.fill();
                });
                if (!still) requestAnimationFrame(frame);
            }
            size(); addEventListener('resize', () => { size(); if (still) frame(); }); frame();
        })();
    </script>
</body>
</html>

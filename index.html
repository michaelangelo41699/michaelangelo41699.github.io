<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michael Gonzalez | Portfolio</title>
    
    <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/examples/jsm/loaders/GLTFLoader.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js",
            "three/examples/jsm/controls/OrbitControls.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js",
            "three/examples/jsm/renderers/CSS2DRenderer.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/renderers/CSS2DRenderer.js"
          }
        }
    </script>

    <link rel="stylesheet" href="css/style.css">

    <style>
        /* Loading Screen Styling included for immediate fix */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #080808;
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-family: 'Courier New', monospace;
            transition: opacity 0.8s ease-in-out;
        }

        .loader-content {
            width: 300px;
            text-align: center;
        }

        #status-text {
            color: #33ff99;
            font-size: 12px;
            letter-spacing: 3px;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(51, 255, 153, 0.5);
        }

        .progress-container {
            width: 100%;
            height: 2px;
            background: rgba(51, 255, 153, 0.1);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        #progress-fill {
            width: 0%;
            height: 100%;
            background: #33ff99;
            box-shadow: 0 0 15px #33ff99;
            transition: width 0.4s ease;
        }

        #loading-logs {
            margin-top: 20px;
            font-size: 10px;
            color: #66ccff;
            text-align: left;
            height: 60px;
            overflow: hidden;
            line-height: 1.5;
            opacity: 0.8;
        }

        .scanner-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: rgba(51, 255, 153, 0.2);
            top: 0;
            animation: scan 3s linear infinite;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }
    </style>
</head>

<body>

<div id="loading-screen">
    <div class="loader-content">
        <div class="scanner-line"></div>
        <h2 id="status-text">Loading...</h2>
        <div class="progress-container">
            <div id="progress-fill"></div>
        </div>
        <div id="loading-logs"></div>
    </div>
</div>

<div id="expanded-project" class="expanded-card" role="dialog" aria-modal="true" aria-label="Project details">
    <button type="button" class="close-button" onclick="closeExpandedCard()" aria-label="Close">&times;</button>
    <div id="expanded-content"></div>
</div>

<section id="home-hero" aria-labelledby="home-title" hidden></section>

<section id="about-panel" aria-labelledby="about-title" hidden></section>

<section id="project-deck" aria-labelledby="deck-title" hidden></section>

<div id="lightbox" hidden>
    <button type="button" class="lightbox-close" aria-label="Close image">&times;</button>
    <img id="lightbox-img" alt="">
    <p id="lightbox-caption"></p>
</div>

<div id="ui-menu">
    <button data-target="OVERVIEW">Home</button>
    <button data-target="ABOUT">About</button>
    <button data-target="PROJECTS">Projects</button>
    <button data-target="CONTACT">Contact</button>
</div>

<script type="module">
    import * as THREE from 'three'; 
    import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/examples/jsm/renderers/CSS2DRenderer.js';
    import { CAMERA_POSITIONS, LERP_FACTOR, BRAIN_SCALE, PROJECT_DETAILS } from './js/data.js';
    import { PROJECTS, getProject, renderDeck, renderCaseStudy } from './js/projects.js';
    import { renderHome } from './js/home.js';
    import { renderAbout, EXTRA_REGIONS } from './js/about.js';

    // --- GLOBAL VARIABLES ---
    let brain, scene, camera, renderer, labelRenderer, controls;
    let time = 0; 
    let contentObject, contentElement, starField, neuralLines, dataProbeObject; 

    let currentSection = 'OVERVIEW'; 
    let currentTarget = CAMERA_POSITIONS.OVERVIEW;
    let transitionInProgress = false;
    const DATA_PROBE_DELAY = 1000; 
    
    // Project deck and brain highlights
    const deckEl = document.getElementById('project-deck');
    const homeEl = document.getElementById('home-hero');
    const aboutEl = document.getElementById('about-panel');
    let glowIds = [];      // regions lit by the About page (timeline or a skill)
    let skillIds = null;   // set while a skill chip is selected
    const mouse = { x: 0, y: 0, active: false };
    const glows = {};
    let highlightLight = null;
    let hoverId = null;
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    let pulseFactor = 0.0;
    const PULSE_SPEED = 0.05;
    const PULSE_MAGNITUDE = 0.03; 

    // --- 1. CORE INITIALIZATION ---
    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a); 
        scene.fog = new THREE.Fog(scene.background, 5, 20); 

        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.copy(currentTarget.pos); 

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);
        
        labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none'; 
        document.body.insertBefore(labelRenderer.domElement, document.getElementById('ui-menu').nextSibling); 

        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 
        controls.dampingFactor = 0.05;
        controls.target.copy(currentTarget.target);

        scene.add(new THREE.AmbientLight(0x404040, 1.0)); 
        const keyLight = new THREE.DirectionalLight(0x99ccff, 3.5); 
        keyLight.position.set(5, 5, 5).normalize();
        scene.add(keyLight);
        
        const rimLight = new THREE.DirectionalLight(0xffaa44, 1.5); 
        rimLight.position.set(-5, -5, -5).normalize();
        scene.add(rimLight);

        starField = createStarfield(); 
        neuralLines = createNeuralNetwork(500); 

        // --- 2. LOADING MANAGER ---
        const manager = new THREE.LoadingManager();
        const progressFill = document.getElementById('progress-fill');
        const logsContainer = document.getElementById('loading-logs');

        manager.onProgress = (url, itemsLoaded, itemsTotal) => {
            const pct = (itemsLoaded / itemsTotal) * 100;
            progressFill.style.width = pct + '%';
            const p = document.createElement('div');
            p.textContent = `loaded ${url.split('/').pop()}`;
            logsContainer.appendChild(p);
            if (logsContainer.children.length > 4) logsContainer.removeChild(logsContainer.firstChild);
        };

        manager.onLoad = () => {
            document.getElementById('status-text').textContent = "Welcome";
            setTimeout(() => {
                document.getElementById('loading-screen').style.opacity = '0';
                setTimeout(() => { 
                    document.getElementById('loading-screen').style.display = 'none';
                }, 800);
            }, 500);
        };

        const loader = new GLTFLoader(manager);
        loader.load('./models/brain/scene.gltf', (gltf) => {
            brain = gltf.scene;
            const bbox = new THREE.Box3().setFromObject(brain);
            const center = bbox.getCenter(new THREE.Vector3());
            brain.position.sub(center); 
            brain.scale.set(BRAIN_SCALE, BRAIN_SCALE, BRAIN_SCALE); 
            scene.add(brain);
            addBrainHighlights(bbox, center);
            
            createAndAttachContent(currentSection);
            // Home is a hero panel, not a floating card; let the loading screen fade first
            setTimeout(showHome, reduceMotion ? 0 : 900);
        });

        animate();
    }

    // --- 3. PROCEDURAL ASSETS ---
    function createStarfield() {
        const geo = new THREE.BufferGeometry();
        const pos = [];
        for (let i = 0; i < 20000; i++) {
            const dist = 150 + Math.random() * 200; 
            const theta = THREE.MathUtils.randFloatSpread(360) * (Math.PI / 180);
            const phi = THREE.MathUtils.randFloatSpread(180) * (Math.PI / 180);
            pos.push(dist * Math.sin(theta) * Math.cos(phi), dist * Math.sin(theta) * Math.sin(phi), dist * Math.cos(theta));
        }
        geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        return scene.add(new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.15 })));
    }

    function createNeuralNetwork(count) {
        const group = new THREE.Group();
        const mat = new THREE.LineBasicMaterial({ color: 0x66ccff, transparent: true, opacity: 0.1 });
        for (let i = 0; i < count; i++) {
            const geo = new THREE.BufferGeometry();
            const p1 = new THREE.Vector3().setFromSphericalCoords(THREE.MathUtils.randFloat(50, 100), Math.random() * 6, Math.random() * 6);
            const p2 = new THREE.Vector3().setFromSphericalCoords(THREE.MathUtils.randFloat(50, 100), Math.random() * 6, Math.random() * 6);
            geo.setAttribute('position', new THREE.Float32BufferAttribute([p1.x, p1.y, p1.z, p2.x, p2.y, p2.z], 3));
            const line = new THREE.Line(geo, mat);
            line.userData.pulse = Math.random() * 10;
            group.add(line);
        }
        scene.add(group);
        return group;
    }

    // A soft round glow, drawn once and shared by every highlight
    function makeGlowTexture() {
        const c = document.createElement('canvas');
        c.width = c.height = 128;
        const ctx = c.getContext('2d');
        const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
        g.addColorStop(0, 'rgba(255,255,255,1)');
        g.addColorStop(0.18, 'rgba(255,255,255,0.85)');
        g.addColorStop(0.45, 'rgba(255,255,255,0.25)');
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 128, 128);
        return new THREE.CanvasTexture(c);
    }

    // One glow per project, placed inside the brain so it turns with it.
    // A single shared light moves to whichever project is hovered (one light keeps the brain fast to draw).
    function addBrainHighlights(bbox, center) {
        const size = bbox.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        const tex = makeGlowTexture();
        [...PROJECTS, ...EXTRA_REGIONS].forEach((p) => {
            const [u, v, w] = p.region;
            const local = new THREE.Vector3(u * size.x, v * size.y, w * size.z).add(center);
            const color = new THREE.Color(p.accent);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
                map: tex, color, transparent: true, opacity: 0,
                blending: THREE.AdditiveBlending, depthTest: false, depthWrite: false
            }));
            sprite.position.copy(local);
            sprite.scale.setScalar(maxDim * 0.5);
            brain.add(sprite);
            glows[p.id] = { sprite, color, local, level: 0 };
        });
        highlightLight = new THREE.PointLight(0xffffff, 0, maxDim * 0.9, 1.5);
        brain.add(highlightLight);
    }

    let lastHighlight = performance.now();
    function updateHighlights() {
        const now = performance.now();
        const dt = Math.min(0.1, (now - lastHighlight) / 1000);
        lastHighlight = now;
        // Time-based fade, so it feels the same on fast and slow devices
        const step = reduceMotion ? 1 : Math.min(1, dt * 9);
        Object.keys(glows).forEach((id) => {
            const g = glows[id];
            const target = (id === hoverId || glowIds.includes(id)) ? 1 : 0;
            g.level += (target - g.level) * step;
            const flicker = reduceMotion ? 1 : 0.88 + 0.12 * Math.sin(time * 0.08);
            g.sprite.material.opacity = Math.min(1, g.level * flicker);
        });
        if (highlightLight) {
            const lit = hoverId || glowIds[0];
            const g = lit && glows[lit];
            if (g) {
                highlightLight.position.copy(g.local);
                highlightLight.color.copy(g.color);
            }
            const level = g ? g.level : 0;
            highlightLight.intensity += (level * 10 - highlightLight.intensity) * step;
        }
    }

    // --- Project deck ---
    function buildDeck() {
        deckEl.innerHTML = renderDeck();
        deckEl.querySelectorAll('.project-card').forEach((card) => {
            const id = card.dataset.id;
            card.addEventListener('click', () => window.openProject(id));
            card.addEventListener('mouseenter', () => { hoverId = id; });
            card.addEventListener('mouseleave', () => { if (hoverId === id) hoverId = null; resetTilt(card); });
            card.addEventListener('focus', () => { hoverId = id; });
            card.addEventListener('blur', () => { if (hoverId === id) hoverId = null; });
            if (!reduceMotion) card.addEventListener('pointermove', (e) => tilt(card, e));
        });
    }

    function tilt(card, e) {
        if (e.pointerType !== 'mouse') return;
        const r = card.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width - 0.5;
        const y = (e.clientY - r.top) / r.height - 0.5;
        card.style.setProperty('--ry', (x * 9).toFixed(2) + 'deg');
        card.style.setProperty('--rx', (-y * 9).toFixed(2) + 'deg');
        card.style.setProperty('--mx', ((x + 0.5) * 100).toFixed(1) + '%');
        card.style.setProperty('--my', ((y + 0.5) * 100).toFixed(1) + '%');
    }

    function resetTilt(card) {
        card.style.setProperty('--rx', '0deg');
        card.style.setProperty('--ry', '0deg');
    }

    function showDeck() {
        deckEl.hidden = false;
        requestAnimationFrame(() => deckEl.classList.add('open'));
    }

    function hideDeck() {
        deckEl.classList.remove('open');
        hoverId = null;
        deckEl.hidden = true;
    }

    // --- Home hero ---
    function buildHome() {
        homeEl.innerHTML = renderHome();
        homeEl.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => window.navigateTo(b.dataset.go)));
        homeEl.querySelectorAll('[data-open]').forEach((b) => b.addEventListener('click', () => window.openProject(b.dataset.open)));
        homeEl.querySelectorAll('.home-chip').forEach((chip) => {
            const id = chip.dataset.project;
            chip.addEventListener('click', () => window.openProject(id));
            chip.addEventListener('mouseenter', () => { hoverId = id; });
            chip.addEventListener('mouseleave', () => { if (hoverId === id) hoverId = null; });
            chip.addEventListener('focus', () => { hoverId = id; });
            chip.addEventListener('blur', () => { if (hoverId === id) hoverId = null; });
        });
    }

    function showHome() {
        if (currentSection !== 'OVERVIEW') return;
        homeEl.hidden = false;
        requestAnimationFrame(() => homeEl.classList.add('open'));
    }

    function hideHome() {
        homeEl.classList.remove('open');
        hoverId = null;
        homeEl.hidden = true;
    }

    window.addEventListener('pointermove', (e) => {
        if (e.pointerType !== 'mouse') return;
        mouse.active = true;
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = (e.clientY / window.innerHeight) * 2 - 1;
    });

    // --- About page ---
    function buildAbout() {
        aboutEl.innerHTML = renderAbout();
        aboutEl.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => window.navigateTo(b.dataset.go)));
        aboutEl.querySelectorAll('[data-open]').forEach((b) => b.addEventListener('click', () => window.openProject(b.dataset.open)));
        aboutEl.querySelectorAll('.tl-open').forEach((b) => b.addEventListener('click', () => window.openProject(b.dataset.project)));
        aboutEl.querySelectorAll('.tl-item').forEach((item) => {
            item.addEventListener('mouseenter', () => { hoverId = item.dataset.glow; });
            item.addEventListener('mouseleave', () => { if (hoverId === item.dataset.glow) hoverId = null; });
        });
        aboutEl.querySelectorAll('.skill-chip').forEach((chip) => {
            chip.addEventListener('click', () => selectSkill(chip));
        });
        aboutEl.addEventListener('scroll', updateTimeline, { passive: true });
    }

    function selectSkill(chip) {
        const wasOn = chip.getAttribute('aria-pressed') === 'true';
        aboutEl.querySelectorAll('.skill-chip').forEach((c) => c.setAttribute('aria-pressed', 'false'));
        const used = aboutEl.querySelector('.skill-used');
        if (wasOn) {
            skillIds = null;
            used.innerHTML = '';
            updateTimeline();
            return;
        }
        chip.setAttribute('aria-pressed', 'true');
        const ids = chip.dataset.projects ? chip.dataset.projects.split(',') : [];
        skillIds = ids;
        glowIds = ids;
        aboutEl.querySelectorAll('.tl-item').forEach((t) => t.classList.remove('active'));
        if (!ids.length) {
            used.innerHTML = `<p>${chip.textContent} is part of my toolkit, but none of the projects here use it yet.</p>`;
            return;
        }
        const buttons = ids.map((id) => {
            const p = getProject(id);
            return p ? `<button type="button" class="used-link" data-project="${p.id}" style="--accent:${p.accent}">${p.title}</button>` : '';
        }).join('');
        used.innerHTML = `<p>${chip.textContent} is used in</p><div class="used-links">${buttons}</div>`;
        used.querySelectorAll('.used-link').forEach((b) => b.addEventListener('click', () => window.openProject(b.dataset.project)));
    }

    // The timeline entry nearest the upper part of the panel is "current" and lights the brain
    function updateTimeline() {
        if (aboutEl.hidden || skillIds) return;
        const items = [...aboutEl.querySelectorAll('.tl-item')];
        const box = aboutEl.getBoundingClientRect();
        const line = box.top + box.height * 0.45;
        let best = null, bestDist = Infinity;
        items.forEach((it) => {
            const r = it.getBoundingClientRect();
            if (r.bottom < box.top || r.top > box.bottom) return;
            const d = Math.abs((r.top + r.bottom) / 2 - line);
            if (d < bestDist) { bestDist = d; best = it; }
        });
        items.forEach((it) => it.classList.toggle('active', it === best));
        glowIds = best ? [best.dataset.glow] : [];
    }

    function showAbout() {
        if (currentSection !== 'ABOUT') return;
        aboutEl.hidden = false;
        aboutEl.scrollTop = 0;
        requestAnimationFrame(() => { aboutEl.classList.add('open'); updateTimeline(); });
    }

    function hideAbout() {
        aboutEl.classList.remove('open');
        aboutEl.hidden = true;
        hoverId = null;
        glowIds = [];
        skillIds = null;
        aboutEl.querySelectorAll('.skill-chip').forEach((c) => c.setAttribute('aria-pressed', 'false'));
        const used = aboutEl.querySelector('.skill-used');
        if (used) used.innerHTML = '';
    }

    // --- Image viewer for project galleries ---
    const lightbox = document.getElementById('lightbox');
    function openLightbox(src, alt) {
        document.getElementById('lightbox-img').src = src;
        document.getElementById('lightbox-img').alt = alt;
        document.getElementById('lightbox-caption').textContent = alt;
        lightbox.hidden = false;
        lightbox.querySelector('.lightbox-close').focus();
    }
    function closeLightbox() {
        lightbox.hidden = true;
    }
    lightbox.addEventListener('click', (e) => {
        if (e.target.id !== 'lightbox-img') closeLightbox();
    });

    // --- 4. CONTENT & UI ---
    function createAndAttachContent(key) {
        if (contentObject) scene.remove(contentObject);
        if (dataProbeObject) scene.remove(dataProbeObject);

        if (key === 'PROJECTS' || key === 'OVERVIEW' || key === 'ABOUT') {
            // The deck and the Home hero take the place of the floating card
            contentObject = null;
            contentElement = document.createElement('div');
            return;
        }

        const data = CAMERA_POSITIONS[key];
        const el = document.createElement('div');
        el.className = 'content-card';
        el.innerHTML = data.html;
        contentElement = el; 
        
        const label = new CSS2DObject(el);
        label.position.copy(data.contentPos);
        contentObject = label;
        scene.add(label);
    }
    
    const SECTION_LABELS = { OVERVIEW: 'Home', ABOUT: 'About me', PROJECTS: 'Projects', CONTACT: 'Say hello' };

    function createDataProbe(data) {
        const el = document.createElement('div');
        el.className = 'data-probe';
        el.innerHTML = `<div>${SECTION_LABELS[currentSection] || currentSection}</div><div class="progress-bar"><div class="progress-fill" id="probe-fill"></div></div>`;
        const label = new CSS2DObject(el);
        label.position.copy(data.contentPos.clone().add(new THREE.Vector3(0.5, -0.5, 0)));
        dataProbeObject = label;
        scene.add(label);
        setTimeout(() => { 
            el.classList.add('ready'); 
            if(document.getElementById('probe-fill')) document.getElementById('probe-fill').style.width = '100%';
        }, 50);
    }

    // --- 5. ANIMATION LOOP ---
    function animate() {
        requestAnimationFrame(animate);
        
        if (transitionInProgress) {
            camera.position.lerp(currentTarget.pos, LERP_FACTOR);
            controls.target.lerp(currentTarget.target, LERP_FACTOR);
            
            if (brain) {
                pulseFactor += PULSE_SPEED;
                const s = BRAIN_SCALE + Math.sin(pulseFactor) * PULSE_MAGNITUDE; 
                brain.scale.set(s, s, s);
            }

            if (camera.position.distanceTo(currentTarget.pos) < 0.01) {
                transitionInProgress = false;
                if (brain) brain.scale.set(BRAIN_SCALE, BRAIN_SCALE, BRAIN_SCALE);
                createDataProbe(currentTarget);
                setTimeout(() => {
                    controls.enabled = true;
                    if(dataProbeObject) dataProbeObject.element.style.opacity = '0';
                    if (currentSection === 'PROJECTS') { showDeck(); return; }
                    if (currentSection === 'OVERVIEW') { showHome(); return; }
                    if (currentSection === 'ABOUT') { showAbout(); return; }
                    const d = CAMERA_POSITIONS[currentSection];
                    contentElement.style.transform = `translate(${d.offset[0]}, ${d.offset[1]}) scale(1) translateZ(0px)`;
                    contentElement.classList.add('active'); 
                }, DATA_PROBE_DELAY);
            }
        }

        if (brain && !transitionInProgress && !hoverId) brain.rotation.y += 0.002;
        if (brain) {
            // On Home the brain leans slightly toward the pointer; everywhere else it settles level
            const follow = currentSection === 'OVERVIEW' && !transitionInProgress && mouse.active && !reduceMotion;
            const tx = follow ? mouse.y * 0.22 : 0;
            const tz = follow ? -mouse.x * 0.12 : 0;
            brain.rotation.x += (tx - brain.rotation.x) * 0.05;
            brain.rotation.z += (tz - brain.rotation.z) * 0.05;
        }
        updateHighlights();
        if (neuralLines) {
            neuralLines.children.forEach(l => {
                l.material.opacity = (Math.sin(time * 0.05 + l.userData.pulse) * 0.05) + 0.1;
            });
        }
        time++;
        controls.update(); 
        renderer.render(scene, camera); 
        labelRenderer.render(scene, camera); 
    }

    // --- 6. WINDOW GLOBALS ---
    const modal = document.getElementById('expanded-project');
    let lastFocus = null;

    window.openExpandedCard = (html, caseMode = false) => {
        lastFocus = document.activeElement;
        document.getElementById('expanded-content').innerHTML = html;
        modal.classList.toggle('case-mode', caseMode);
        modal.scrollTop = 0;
        modal.classList.add('visible');
        controls.enabled = false;
        modal.querySelector('.close-button').focus({ preventScroll: true });
    };
    window.closeExpandedCard = () => {
        modal.classList.remove('visible');
        controls.enabled = true;
        if (lastFocus && document.body.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
    };
    window.openProject = (key) => {
        const project = getProject(key);
        if (project) {
            window.openExpandedCard(renderCaseStudy(project), true);
            modal.querySelectorAll('.case-shot').forEach((shot) => {
                shot.addEventListener('click', () => openLightbox(shot.dataset.full, shot.dataset.alt));
            });
        } else if (PROJECT_DETAILS[key]) {
            window.openExpandedCard(PROJECT_DETAILS[key]);
        }
    };

    document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return;
        if (!lightbox.hidden) closeLightbox();
        else if (modal.classList.contains('visible')) window.closeExpandedCard();
    });
    window.navigateTo = (key) => {
        if (CAMERA_POSITIONS[key] && !transitionInProgress && key !== currentSection) {
            if (contentElement) contentElement.classList.remove('active');
            hideDeck();
            hideHome();
            hideAbout();
            currentTarget = CAMERA_POSITIONS[key];
            currentSection = key; 
            controls.enabled = false; 
            transitionInProgress = true;
            createAndAttachContent(key); 
        }
    };

    document.getElementById('ui-menu').addEventListener('click', (e) => {
        const t = e.target.getAttribute('data-target');
        if (t) window.navigateTo(t);
    });

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
    });

    buildDeck();
    buildHome();
    buildAbout();
    init();
</script>
</body>
</html>
